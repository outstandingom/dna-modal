[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-knowledge-graph"
version = "2.0.0"
description = "Recursive Compositional DNA Memory Architecture for Autonomous AI Agents"
authors = [{name = "OutstandingOm"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "openai",
    "python-dotenv",
    "scikit-learn",
]

[project.scripts]
server = "server.app:main"
inference = "inference:main"

[tool.setuptools]
packages = ["server", "dna_memory"]
py-modules = ["knowledge_graph_env", "inference"]
